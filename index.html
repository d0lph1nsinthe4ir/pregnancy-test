<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestimate — How far along are you?</title><style>
:root{--paper:#f7f2e7;--ink:#232323;--blue:#224f78;--red:#e05245;--yellow:#f1c75b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header,main,footer{max-width:920px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink)}.brand{font-size:25px;font-weight:900;letter-spacing:-1.5px}.tag{font-size:11px;letter-spacing:1.8px;font-weight:bold;color:var(--blue)}h1{font-size:clamp(46px,9vw,96px);letter-spacing:-.075em;line-height:.99;margin:25px 0}h2{font-size:clamp(30px,6vw,56px);letter-spacing:-.055em;line-height:1.05;margin:20px 0}p{font-size:18px;line-height:1.5;max-width:620px}.button{background:var(--blue);color:white;border:2px solid var(--blue);padding:16px 24px;font-size:16px;font-weight:bold;cursor:pointer}.button.secondary{background:transparent;color:var(--blue)}.button:focus-visible,.answer:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}.hero{padding:48px 0}.diagram{width:100%;max-width:520px;margin:25px 0}.progress{height:8px;background:#ded7ca;margin:24px 0}.progress div{height:100%;background:var(--red);transition:width .25s}.answer-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:30px 0}.answer{border:2px solid var(--ink);background:#fffaf0;text-align:left;padding:20px;font-size:17px;cursor:pointer;min-height:80px}.answer:hover{background:var(--yellow)}.answer.selected{background:var(--yellow);border-color:var(--red)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.small{font-size:13px;color:#56514b}.result{background:var(--yellow);padding:25px;margin:24px 0}.meter{display:flex;height:30px;gap:3px;margin:20px 0}.meter span{flex:1;background:var(--blue);opacity:.15}.meter span.active{opacity:1}input[type=number]{padding:12px;font:inherit;width:110px;border:2px solid var(--ink);background:white}footer{border-top:2px solid var(--ink);font-size:12px;color:#555}#app{min-height:460px} @media(max-width:600px){header,main,footer{padding:17px}.hero{padding:25px 0}.answer-list{grid-template-columns:1fr}.answer{min-height:64px}h1{font-size:56px}}
</style></head><body><header><div class="brand">gestimate<span style="color:var(--red)">.</span></div><div class="tag">AN EXPERIMENT IN GUESSWORK</div></header><main><div id="app" aria-live="polite"></div></main><footer>For entertainment, not medical dating. Symptoms vary widely; ultrasound and clinical dating are more reliable. No answers are transmitted or saved.</footer><script>
const app=document.getElementById('app');const weeks=Array.from({length:43},(_,i)=>i);let posterior=[],history=[],asked=[],step=0;const q=[
{id:'movement',title:'Have you felt the baby move?',answers:['Not yet','Little flutters','Distinct kicks','Strong rolls and stretches','Not sure'],likelihood:[[0,16,24,27],[14,19,22,27],[18,24,31,38],[25,31,40,43],null]},
{id:'bump',title:'What is your bump situation?',answers:['No visible change','A little rounder','Obviously pregnant','Very large and in the way','Not sure'],likelihood:[[0,8,14,20],[9,15,22,29],[16,23,34,42],[27,33,42,43],null]},
{id:'nausea',title:'How is the nausea?',answers:['None at all','Pretty intense right now','It was bad, but it has eased','It comes and goes','Not sure'],likelihood:[null,[5,7,11,17],[11,15,24,35],[6,12,28,42],null]},
{id:'energy',title:'How is your energy?',answers:['Unusually exhausted','Starting to feel human again','Pretty normal','Tired again, but for different reasons','Not sure'],likelihood:[[5,8,13,40],[11,15,23,29],null,[27,32,42,43],null]},
{id:'reflux',title:'Has heartburn become part of your personality?',answers:['No','Occasionally','Frequently','Constantly','Not sure'],likelihood:[null,[13,21,33,42],[20,27,39,43],[27,33,42,43],null]},
{id:'pressure',title:'Any pressure low in your pelvis?',answers:['None','A little','A lot','Feels like the baby is very low','Not sure'],likelihood:[null,[18,25,38,43],[27,33,42,43],[34,37,42,43],null]},
{id:'sleep',title:'What is keeping you awake?',answers:['Nothing pregnancy-related','Nausea or bathroom trips','Finding a comfortable position','Everything, especially the bump','Not sure'],likelihood:[null,[5,10,22,39],[18,25,38,43],[27,33,42,43],null]},
{id:'breasts',title:'What has changed with your breasts?',answers:['Tender or sore','Not much lately','Leaking a little colostrum','No changes','Not sure'],likelihood:[[4,7,13,22],null,[19,28,42,43],null,null]},
{id:'appetite',title:'How does food sound?',answers:['Most foods sound terrible','Hungry all the time','Full after small meals','Pretty normal','Not sure'],likelihood:[[5,8,13,18],[11,18,30,39],[24,31,42,43],null,null]},
{id:'tightening',title:'Do you get episodes of belly tightening?',answers:['Never','Occasionally, not painful','Frequently, but irregular','Regular and getting stronger','Not sure'],likelihood:[null,[19,27,40,43],[27,33,42,43],[36,39,42,43],null]},
{id:'bellybutton',title:'What has happened to your belly button?',answers:['No change','Getting flatter','Popping outward','Hard to see it over the bump','Not sure'],likelihood:[null,[18,24,34,42],[22,29,40,43],[28,35,42,43],null]},
{id:'breath',title:'How are stairs treating you?',answers:['Same as ever','A little more breathless','Very breathless with ordinary activity','Hard to tell','Not sure'],likelihood:[null,[5,16,37,43],[26,32,42,43],null,null]},
{id:'skin',title:'Have you noticed a dark line down your abdomen?',answers:['No','A faint line','A prominent line','Not sure'],likelihood:[null,[13,20,34,42],[19,27,42,43],null]},
{id:'feet',title:'Have your feet or ankles started swelling?',answers:['Not at all','Sometimes','Most days','Not sure'],likelihood:[null,[22,30,39,43],[28,35,42,43],null]},
{id:'movementpattern',title:'How predictable are the movements?',answers:['I cannot feel movements yet','Occasional, unpredictable sensations','I notice a pattern most days','Constant wriggling and stretching','Not sure'],likelihood:[[0,16,24,27],[15,20,26,33],[23,28,38,43],[28,33,42,43],null]},
{id:'cravings',title:'What is happening with food aversions?',answers:['Strong aversions right now','They have mostly faded','Never had them','Not sure'],likelihood:[[5,8,13,19],[11,17,29,42],null,null]},
{id:'pelvic',title:'Is turning over in bed an athletic event?',answers:['Not at all','A little awkward','A full-body operation','Not sure'],likelihood:[null,[19,26,37,43],[28,34,42,43],null]},
{id:'contractions',title:'Are you having contractions?',answers:['No','Occasional irregular tightening','Regular painful contractions getting closer','I am actively pushing','Not sure'],likelihood:[null,[22,29,42,43],[36,39,42,43],[38,40,42,43],null]},
{id:'test',title:'Have you had a positive pregnancy test?',answers:['Yes','No','I have not taken one','Not sure'],likelihood:[null,null,null,null]},
{id:'identity',title:'Which best describes you?',answers:['I am pregnant','I might be pregnant','I can't get pregnant','Goo goo gaga','Prefer not to say'],likelihood:[null,null,null,null,null]}
];
function likelihood(w,r){if(!r)return 1;let [a,b,c,d]=r; if(w<a)return .07;if(w<b)return .07+.93*(w-a)/Math.max(1,b-a);if(w<=c)return 1;if(w<d)return 1-.93*(w-c)/Math.max(1,d-c);return .07}
function entropy(p){return -p.reduce((s,x)=>s+(x>0?x*Math.log(x):0),0)}function normalized(a){let z=a.reduce((s,x)=>s+x,0);return a.map(x=>x/z)}function predict(qi,ai){let r=q[qi].likelihood[ai];return normalized(posterior.map((p,w)=>p*likelihood(w,r)))}function pick(){let remaining=q.map((x,i)=>i).filter(i=>!asked.includes(i)&&i!==18&&i!==19);if(step===0)return 19;if(step===1)return 18;if(step===2)return 0;if(step===3)return 1;if(step===4)return 2;if(step===17&&!asked.includes(17))return 17;let current=entropy(posterior);return remaining.map(i=>{let outcomes=q[i].answers.map((_,a)=>predict(i,a));let probs=q[i].answers.map((_,a)=>posterior.reduce((s,p,w)=>s+p*likelihood(w,q[i].likelihood[a]),0));let total=probs.reduce((a,b)=>a+b,0);let gain=current-probs.reduce((s,p,a)=>s+p/total*entropy(outcomes[a]),0);return {i,gain}}).sort((a,b)=>b.gain-a.gain)[0]?.i??remaining[0]}
function shell(body){app.innerHTML=body}function start(){posterior=normalized(weeks.map(w=>w<4?.18:w>41?.3:1));history=[];asked=[];step=0;render()}
function render(){let qi=pick();if(qi===undefined||step>=20){finish();return}let x=q[qi];shell('<div class="tag">QUESTION '+(step+1)+' / 20</div><div class="progress"><div style="width:'+((step+1)/20*100)+'%"></div></div><h2>'+x.title+'</h2><div class="answer-list">'+x.answers.map((a,i)=>'<button class="answer" data-answer="'+i+'">'+a+'</button>').join('')+'</div><p class="small">Choose the closest answer. The questions adapt as we go.</p><div class="row"><button class="button secondary" id="back" '+(!history.length?'disabled':'')+'>← Back</button><button class="button secondary" id="skip">Skip</button></div>');app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>respond(qi,+b.dataset.answer));app.querySelector('#skip').onclick=()=>respond(qi,x.answers.length-1);app.querySelector('#back').onclick=back}
function respond(qi,ai){history.push({qi,ai,prior:[...posterior]});asked.push(qi);step++;if(qi===19&&ai===2){special('You are a man.','Our algorithm has identified a minor complication in its assumptions.');return}if(qi===19&&ai===3){special('You are the baby.','This is a remarkable level of reading comprehension for someone not yet born.');return}if(qi===18&&ai===1){special('You are not pregnant.','At least, that is what your test says. This game cannot determine whether you are pregnant.');return}if(qi===17&&ai===3){special('You are literally giving birth.','Our calculations suggest this questionnaire may no longer be your highest priority.');return}posterior=predict(qi,ai);if(step>=20){finish();return}render()}
function back(){if(!history.length)return;let h=history.pop();posterior=h.prior;asked.pop();step--;render()}
function finish(){let peak=posterior.indexOf(Math.max(...posterior));let cum=0,lo=0,hi=42;for(let w=0;w<43;w++){cum+=posterior[w];if(cum>=.1){lo=w;break}}cum=0;for(let w=0;w<43;w++){cum+=posterior[w];if(cum>=.9){hi=w;break}}shell('<div class="tag">GESTATIONAL ASSESSMENT / COMPLETE</div><div class="result"><div class="tag">OUR BEST GUESS</div><h1>'+peak+' weeks.</h1><p>Most plausible range: '+lo+'–'+hi+' weeks.</p></div><p>Based on '+step+' symptom answers. This is an experimental guessing game, not a validated probability model.</p><div class="row"><button class="button" id="reveal">Reveal my actual week</button><button class="button secondary" id="again">Play again</button></div><div id="actual"></div>');app.querySelector('#again').onclick=start;app.querySelector('#reveal').onclick=()=>{let div=app.querySelector('#actual');div.innerHTML='<p><label>How many weeks are you actually? <input type="number" min="0" max="42" step="1" id="actualweek"></label> <button class="button" id="compare">Compare</button></p><p id="feedback"></p>';div.querySelector('#compare').onclick=()=>{let n=+div.querySelector('#actualweek').value;if(div.querySelector('#actualweek').value===''||!Number.isInteger(n)||n<0||n>42){div.querySelector('#feedback').textContent='Enter a whole week between 0 and 42.';return}let delta=Math.abs(n-peak);div.querySelector('#feedback').textContent=delta===0?'Exactly right. We are insufferably pleased with ourselves.': 'We were '+delta+' week'+(delta===1?'':'s')+' off. The algorithm will be hearing about this.'}}}
function special(title,subtitle){shell('<div class="tag">UNEXPECTED FINDING</div><div class="result" style="background:var(--red);color:white"><h2>'+title+'</h2><p>'+subtitle+'</p></div><button class="button" id="again">Play again</button>');app.querySelector('#again').onclick=start}
function intro(){shell('<section class="hero"><div class="tag">GESTATIONAL ESTIMATION SYSTEM / V 0.1</div><h1>How pregnant<br>are you, <em>exactly?</em></h1><p>Answer up to 20 questions about your symptoms. Our suspiciously confident algorithm will guess how many weeks along you are.</p><svg class="diagram" viewBox="0 0 520 130" aria-label="Abstract gestational timeline illustration"><rect width="520" height="130" fill="#f1c75b"/><g fill="none" stroke="#224f78" stroke-width="3"><circle cx="90" cy="65" r="22"/><circle cx="210" cy="65" r="34"/><circle cx="340" cy="65" r="46"/></g><circle cx="468" cy="65" r="55" fill="#e05245"/><g fill="#232323" font-size="11" font-weight="bold"><text x="78" y="113">?</text><text x="200" y="113">??</text><text x="330" y="113">???</text><text x="451" y="69" fill="white">20Q</text></g></svg><div class="row"><button class="button" id="start">Start the test →</button><span class="small">No account. No data collected. Some nonsense.</span></div></section>');app.querySelector('#start').onclick=()=>{start()}}
intro();
</script></body></html>
