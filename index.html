const direction=actual===guess?'Exactly right.':actual>guess?'Gestimate guessed earlier than your actual week.':'Gestimate guessed later than your actual week.';
return '<section class="compare-report"><div class="tag">THE REVEAL</div><h3>How Gestimate interpreted your answers</h3><p>The bars show how the game weighted each gestational week based on your responses.</p><div class="compare-legend"><span><i class="compare-key" style="background:#224f78"></i>Model weighting</span><span><i class="compare-key" style="background:#d44d43"></i>Our guess</span><span><i class="compare-key" style="background:#e5b42e"></i>Your actual week</span></div><svg class="compare-chart" viewBox="0 0 630 220" role="img" aria-label="Estimated gestational-week weights from weeks 3 to 42. Guess: '+guess+' weeks. Actual: '+actual+' weeks."><line x1="14" y1="178" x2="614" y2="178" stroke="#555" stroke-width="1"/>'+bars+'<line x1="'+ax.toFixed(1)+'" y1="12" x2="'+ax.toFixed(1)+'" y2="180" stroke="#e5b42e" stroke-width="4"/><circle cx="'+ax.toFixed(1)+'" cy="12" r="5" fill="#e5b42e"/>'+ticks+'<text x="314" y="217" text-anchor="middle">Gestational week</text></svg><div class="compare-stats"><div><strong>'+guess+'</strong><span>Our guess · weeks</span></div><div><strong>'+actual+'</strong><span>Your actual week</span></div><div><strong>'+delta+'</strong><span>Week'+(delta===1?'':'s')+' apart</span></div></div><p>'+direction+'</p><p class="compare-note">These bars represent relative scores from Gestimate’s experimental model, not percentages of pregnant women or clinically validated probabilities.</p></section>'
}
function finish(){let peak=posterior.indexOf(Math.max(...posterior));let cum=0,lo=3,hi=42;for(let w=3;w<43;w++){cum+=posterior[w];if(cum>=.1){lo=w;break}}cum=0;for(let w=3;w<43;w++){cum+=posterior[w];if(cum>=.9){hi=w;break}}shell('<div class="tag">GESTATIONAL ASSESSMENT / COMPLETE</div><div class="result"><div class="tag">OUR BEST GUESS</div><h1>'+peak+' weeks.</h1><p>Most plausible range: '+lo+'–'+hi+' weeks.</p></div><p>Based on '+step+' symptom answers. This is an experimental guessing game, not a validated probability model.</p><div class="row"><button class="button" id="reveal">Reveal my actual week</button><button class="button secondary" id="again">Play again</button></div><div id="actual"></div>');app.querySelector('#again').onclick=start;app.querySelector('#reveal').onclick=()=>{let div=app.querySelector('#actual');div.innerHTML='<p><label>How many weeks are you actually? <input type="number" min="3" max="42" step="1" id="actualweek"></label> <button class="button" id="compare">Compare</button></p><p id="feedback"></p>';div.querySelector('#compare').onclick=()=>{let n=+div.querySelector('#actualweek').value;if(div.querySelector('#actualweek').value===''||!Number.isInteger(n)||n<3||n>42){div.querySelector('#feedback').textContent='Enter a whole week between 3 and 42.';return}let delta=Math.abs(n-peak);div.querySelector('#feedback').innerHTML=comparisonReport(n,peak);}}}
function cannotPregnantFollowup(){cancelTransition();shell('<div class="tag">ONE QUICK FOLLOW-UP</div><div class="progress"><div style="width:10%"></div></div><h2>What best describes your situation?</h2><div class="answer-list"><button class="answer" data-reason="man">I have a penis</button><button class="answer" data-reason="fertility">Pregnancy has not been possible for me</button><button class="answer" data-reason="trying">I have been hoping for a positive test</button><button class="answer" data-reason="private">Something else / I would rather not say</button></div><p class="small">You do not have to share personal details to play.</p><div class="row"><button class="button secondary" id="back">← Back</button></div>');app.querySelector('#back').onclick=back;app.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{let reason=b.dataset.reason;if(reason==='man')special('Our guess: You are a man.','A bold guess based on anatomy, not a certainty about your identity.');else if(reason==='fertility')special('No gestimate available.','Fertility experiences can be complicated. This silly symptom game cannot tell you anything about yours.');else if(reason==='trying')special('You might be trying to conceive.','No predictions or promises from this algorithm. Wishing you well, whatever your circumstances.');else {identityPrivate=true;uncertaintyStreak++;nextQuestion();}})}

}
function special(title,subtitle){cancelTransition();shell('<div class="tag">UNEXPECTED FINDING</div><div class="result easter-result" style="background:var(--red);color:white">'+easterIcon(title)+'<h2>'+title+'</h2><p>'+subtitle+'</p></div><button class="button" id="again">Play again</button>');app.querySelector('#again').onclick=start}
function intro(){shell('<section class="hero"><div class="tag">GESTATIONAL ESTIMATION SYSTEM / V 0.1</div><h1>How pregnant<br>are you, <em>exactly?</em></h1><p>Answer up to 20 questions about your symptoms. Our suspiciously confident algorithm will guess how many weeks along you are.</p><svg class="diagram" viewBox="0 0 520 160" role="img" aria-label="Four growing circles representing a guessing game, ending with 20 questions" xmlns="http://www.w3.org/2000/svg"><rect width="520" height="160" fill="#f1c75b"/><g fill="none" stroke="#224f78" stroke-width="3"><circle cx="65" cy="67" r="19"/><circle cx="182" cy="67" r="31"/><circle cx="307" cy="67" r="43"/></g><circle cx="445" cy="67" r="49" fill="#e05245"/><g fill="#232323" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="bold" text-anchor="middle"><text x="65" y="143">?</text><text x="182" y="143">??</text><text x="307" y="143">???</text></g><text x="445" y="73" fill="white" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold">20Q</text></svg><div class="row"><button class="button" id="start">Start the test →</button><span class="small">No account. No data collected. Some nonsense.</span></div></section>');app.querySelector('#start').onclick=()=>{start()}}
